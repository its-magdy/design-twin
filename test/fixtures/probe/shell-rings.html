<!doctype html>
<!-- group 11 e2e page (invented names): a shared shell tagged with ANOTHER screen's ids (D32 tag-alias), a stale-prefix
     tag and a tag on two elements (DT-47 tagsNotInExpectation), inline vs block display (F-78), and strokes drawn
     without a border (D34): Tailwind v4's five-shadow ring stack, inset and outside, and outlines. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rota Settings</title>
<style>
  body { margin: 0; font-family: Arial, sans-serif; }
  .frame { width: 800px; height: 600px; background: rgb(250, 250, 250); position: relative; }
  /* Tailwind v4's box-shadow stack, as its utilities write it */
  .tw { --tw-shadow: 0 0 #0000; --tw-inset-shadow: 0 0 #0000; --tw-inset-ring-shadow: 0 0 #0000; --tw-ring-offset-shadow: 0 0 #0000; --tw-ring-shadow: 0 0 #0000;
        box-shadow: var(--tw-inset-shadow), var(--tw-inset-ring-shadow), var(--tw-ring-offset-shadow), var(--tw-ring-shadow), var(--tw-shadow); }
  .ring-1 { --tw-ring-shadow: var(--tw-ring-inset,) 0 0 0 1px var(--tw-ring-color, currentcolor); }
  .ring-2 { --tw-ring-shadow: var(--tw-ring-inset,) 0 0 0 2px var(--tw-ring-color, currentcolor); }
  .ring-inset { --tw-ring-inset: inset; }
  .ring-offset-2 { --tw-ring-offset-shadow: var(--tw-ring-inset,) 0 0 0 2px rgb(255, 255, 255); }
  .shadow-md { --tw-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); }
  .shadow-xs { --tw-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05); }
  .hard-shadow { --tw-shadow: 4px 4px 0 1px rgb(29, 29, 31); }
  .glow { --tw-shadow: 0 0 8px 2px rgb(10 132 255 / 0.5); }
  .ring-grey { --tw-ring-color: oklch(87% 0 0); }
  .ring-blue { --tw-ring-color: rgb(10, 132, 255); }
  .box { width: 120px; height: 40px; margin: 8px; }
  .outline-in { outline: 1px solid rgb(118, 118, 128); outline-offset: -1px; }
  .focus-ring-rest { outline: 2px solid transparent; outline-offset: 2px; }
  .bordered { border: 1px solid rgb(5, 5, 5); }
</style>
</head>
<body>
<div class="frame" data-dt-node="60:1">
  <nav data-dt-node="I71:9;3:4" style="display: flex; height: 48px; background: rgb(29, 29, 31)">
    <span data-dt-node="I99:9;7:7" style="color: white">Rota</span>
  </nav>
  <div data-dt-node="88:2">first</div>
  <div data-dt-node="88:2">second</div>
  <div data-dt-node="88:1" style="display: none">hidden</div>
  <div data-dt-node="I71:9;3:5">twin a</div>
  <div data-dt-node="I72:1;3:5">twin b</div>
  <p data-dt-node="60:20">Shift <span data-dt-node="60:21">length</span></p>
  <div class="tw ring-1 ring-inset ring-grey box" data-dt-node="60:30"></div>
  <div class="tw ring-2 ring-blue box" data-dt-node="60:31"></div>
  <div class="outline-in box" data-dt-node="60:32"></div>
  <div class="focus-ring-rest box" data-dt-node="60:33"></div>
  <div class="tw ring-1 ring-inset ring-grey bordered box" data-dt-node="60:34"></div>
  <div class="tw ring-2 ring-blue ring-offset-2 box" data-dt-node="60:35"></div>
  <div class="tw shadow-md box" data-dt-node="60:36"></div>
  <div class="tw ring-1 ring-blue shadow-md box" data-dt-node="60:37"></div>
  <div class="tw glow box" data-dt-node="60:38"></div>
  <div class="tw shadow-xs box" data-dt-node="60:39"></div>
  <div class="tw hard-shadow box" data-dt-node="60:40"></div>
</div>
</body>
</html>
