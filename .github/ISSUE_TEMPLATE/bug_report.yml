name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **do not paste real client designs, export files from private Figma files,
        or your bridge token**. Describe the structure instead (e.g. "a frame with an auto-layout list of instances").
  - type: dropdown
    id: piece
    attributes:
      label: Which part?
      options:
        - Figma plugin (export)
        - dtwin CLI
        - MCP server
        - Claude Code plugin (skills)
        - design-to-code tools (tokens, audit, verify)
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dtwin ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or error
      description: The command's output, with anything private removed.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `dtwin --version`, or the commit you are on.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: macOS 15, Node 24.11, Figma desktop 125.x, Claude Code 2.x
