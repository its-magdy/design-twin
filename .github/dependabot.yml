# Monthly, grouped version updates (one PR per ecosystem); security updates are not held by this schedule or the cooldown.
# The cooldown leaves a new release a week to be pulled or flagged before it is proposed.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # the root bun.lock covers the workspaces (bridge, figma-plugin). bunfig.toml's minimumReleaseAge holds a local
  # `bun install` / `bun update` to the same 7 days. packageManager (bun@x) and the CI's Bun are not bumped by this: move
  # them by hand.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      bun-minor-patch:
        update-types: [minor, patch]
        patterns: ["*"]
