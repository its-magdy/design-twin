name: test

on:
  push:
    branches: [main]
  pull_request:

# Every job asks for what it needs (zizmor's excessive-permissions); the workflow grants nothing.
permissions: {}

# A newer push to a pull request cancels its older run. On main a run is never cancelled once started; a queued one is
# replaced by a newer push's (one running + one pending per group).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One leg per runner, so the slow browser suites neither queue behind each other nor share a CPU (their Budget checks
  # are load-sensitive). `fast` is every suite but the probe e2e ones (run-suites --fast) plus the repo checks; the other
  # primary-Node legs name exactly those suites between them, and a leg with `node:` (or `os:`) runs `--fast` alone on that
  # Node (or OS) — test/run-suites.test.ts holds this matrix to FAST_SKIP, so a suite cannot drop out of CI.
  test:
    name: test (${{ matrix.leg }})
    # pinned, not ubuntu-latest: the Budget checks' margins were measured on this image
    runs-on: ${{ matrix.os || 'ubuntu-24.04' }}
    # A leg with `allow-failure` shows red when it fails but does not fail `test result` (a failed continue-on-error
    # job is a success to `needs`)
    continue-on-error: ${{ matrix.allow-failure || false }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: fast
            suites: --fast
          # the same quick suites on the next Node LTS (package.json engines is >=24.2)
          - leg: fast-node26
            node: 26
            suites: --fast
          # the same quick suites on Windows; non-blocking until it has stayed green (the dtwin daemon is not
          # supported there, and its checks skip with that reason)
          - leg: fast-windows
            os: windows-latest
            suites: --fast
            allow-failure: true
          - leg: drive-e2e
            suites: verify-probe-drive-e2e
          - leg: drive-tail-e2e
            suites: verify-probe-drive-tail-e2e verify-probe-e2e
          - leg: behaviour-e2e
            suites: verify-probe-behaviour-e2e
    steps:
      # Full commit SHAs, not tags (a tag can be moved); Dependabot keeps them and the version comments current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # explicit: node-version-file would resolve engines' >=24.2 to the newest Node, not 24
          node-version: ${{ matrix.node || 24 }}
          cache: npm

      - name: Install
        run: npm ci

      # Every leg runs browser suites (the probe e2e ones, and in `fast` verify-probe, verify-values, verify-own-pixels and
      # the visual e2e); locally they skip when no browser is installed, in CI they must run (D3).
      # https://playwright.dev/docs/ci — in the background, overlapping the checks below; its failure fails the `wait`.
      - name: Install Playwright's chromium
        id: chromium
        background: true
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        if: matrix.leg == 'fast'
        run: npm run typecheck

      # Committed build artifacts must match their sources: rebuild, then fail on any diff.
      # (claude-plugin/scripts/ is also checked byte-for-byte by test/verify-build.test.ts.)
      # bridge/dist/ is built here too but is gitignored, so it is not part of the diff.
      - name: Committed build artifacts are in sync
        if: matrix.leg == 'fast'
        run: |
          npm run build
          git diff --exit-code -- figma-plugin/code.js claude-plugin/scripts

      # The suites run the bridge from src/; smoke the tsc-emitted tree the npm package ships.
      - name: Emitted bridge runs
        if: matrix.leg == 'fast'
        run: npm run build --workspace bridge && node bridge/dist/figma-pull.js --help && node bridge/dist/figma-pull.js --version

      - wait: chromium

      # lint:any and lint:types run as the first two suites of the `fast` leg.
      - name: Test
        run: node test/run-suites.ts ${{ matrix.suites }}

  # The one check a ruleset requires: a leg's check name changes when a leg is added or renamed, this one does not. It runs
  # even when a leg failed or was cancelled (a job skipped because its `needs` failed would not block a merge).
  result:
    name: test result
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        if: needs.test.result != 'success'
        run: exit 1
