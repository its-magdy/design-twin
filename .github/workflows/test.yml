name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Committed build artifacts must match their sources: rebuild all three, then fail on any diff.
      # (claude-plugin/scripts/ is also checked byte-for-byte by test/verify-build.test.js.)
      - name: Committed build artifacts are in sync
        run: |
          npm run build
          git diff --exit-code -- bridge/figma-mcp.mjs figma-plugin/code.js claude-plugin/scripts

      - name: Test
        run: npm test
