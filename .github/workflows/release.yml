name: release

# Pushing a v* tag publishes bridge/ (the @design-twin/dtwin package, `dtwin` CLI) to npm, then creates the GitHub Release.
# Write the changes under CHANGELOG.md's "## [Unreleased]", bun run release:bump <x.y.z> (every version file, code.js,
# bun.lock, the CHANGELOG.md entry), merge, then tag that commit: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions: {}

# Never cancel a release halfway; a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Check the tag and the package before publishing anything.
  preflight:
    name: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the next step can see main.
          fetch-depth: 0

      # Only a commit that went through main (and so its required checks) is released: a tag on a branch commit or a
      # local one would otherwise publish code no suite ran on.
      - name: Tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main. Merge it, then tag the merged commit."
            exit 1
          fi

      # A tag pushed without the version bump would publish a package that reports the previous version.
      - name: Tag matches bridge/package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          v=$(jq -r .version bridge/package.json)
          if [ "$v" != "$version" ]; then
            echo "::error file=bridge/package.json::bridge/package.json is $v, tag is $GITHUB_REF_NAME. Bump it before tagging."
            exit 1
          fi
          # One version for everything a release ships (bun run release:bump sets them all): the Figma plugin reports
          # its own in the hello, and the bridge compares the two.
          for f in figma-plugin/package.json claude-plugin/.claude-plugin/plugin.json; do
            fv=$(jq -r .version "$f")
            if [ "$fv" != "$version" ]; then
              echo "::error file=$f::$f is $fv, tag is $GITHUB_REF_NAME. Run bun run release:bump $version before tagging."
              exit 1
            fi
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
          # A release never restores a cache (zizmor cache-poisoning): what it checks is installed fresh.
          no-cache: true

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # The GitHub Release opens with this version's CHANGELOG.md entry (release:bump writes it from Unreleased); a tag
      # whose version has none stops here, before anything is published.
      - name: CHANGELOG.md has this version's entry
        run: |
          mkdir -p "$RUNNER_TEMP/release-notes"
          bun --no-install --no-env-file bridge/release-bump.ts --notes "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes/notes.md"
          cat "$RUNNER_TEMP/release-notes/notes.md"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes/notes.md
          if-no-files-found: error
          retention-days: 7

      # The package ships its TypeScript as is (no build): smoke the CLI the way the installed `dtwin` starts it.
      - name: CLI runs
        run: |
          bun --no-install --no-env-file bridge/src/figma-pull.ts --help
          bun --no-install --no-env-file bridge/src/figma-pull.ts --version

      # The one tarball this release publishes, built here and checked here; publish-npm uploads exactly these bytes.
      # prepack (bridge/pack.ts) copies the design-to-code bundles and the Figma plugin in and derives bun.lock — the
      # root lock's pins for the package alone (postpack removes them all); it refuses to pack a bundle whose hints name
      # a script the package leaves out, or a lock that is not the root's pins.
      - name: Pack
        id: pack
        working-directory: bridge
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          # npm pack prints the tarball's file name last.
          tarball=$(npm pack --pack-destination "$RUNNER_TEMP/npm-package" | tail -n 1)
          if [ ! -f "$RUNNER_TEMP/npm-package/$tarball" ]; then
            echo "::error::npm pack wrote no '$tarball'"
            exit 1
          fi
          sha256=$(sha256sum "$RUNNER_TEMP/npm-package/$tarball" | awk '{print $1}')
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::bad sha256: '$sha256'"; exit 1; }
          echo "$tarball $sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      # Installed the way the Homebrew formula does (bun install --production --frozen-lockfile, empty cache), then
      # loaded and asked for its MCP tools — `dtwin --version` alone would pass with no dependency installed.
      - name: Package installs from its lockfile
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun --no-install --no-env-file bridge/verify-pack.ts "$RUNNER_TEMP/npm-package/$TARBALL"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    name: publish npm
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write # npm trusted publishing (OIDC) and the provenance statement; nothing here reads the repo
    steps:
      # npm, not bun publish: trusted publishing (OIDC) and provenance are npm CLI features. Only the publish uses Node.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      # The bytes preflight checked, or nothing.
      - name: Tarball is the one preflight checked
        env:
          TARBALL: ${{ needs.preflight.outputs.tarball }}
          SHA256: ${{ needs.preflight.outputs.sha256 }}
        run: |
          got=$(sha256sum "$RUNNER_TEMP/npm-package/$TARBALL" | awk '{print $1}')
          if [ -z "$SHA256" ] || [ "$got" != "$SHA256" ]; then
            echo "::error::$TARBALL is $got, preflight checked '$SHA256'"
            exit 1
          fi

      # Trusted publishing (id-token: write): no npm token to store or expire. Fails if npmjs.com has no trusted
      # publisher for this repo + release.yml. Safe to re-run: a version already on the registry (or still staged) is
      # skipped. A prerelease (1.2.3-alpha.0) goes to its own dist-tag so `latest` never points at it. Publishing the
      # tarball file runs no lifecycle script: nothing is packed again.
      - name: Publish @design-twin/dtwin
        env:
          TARBALL: ${{ needs.preflight.outputs.tarball }}
        run: |
          file="$RUNNER_TEMP/npm-package/$TARBALL"
          name=$(tar -xOzf "$file" package/package.json | jq -r .name)
          version=$(tar -xOzf "$file" package/package.json | jq -r .version)
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry, skipping"
            exit 0
          fi
          tag=latest
          case "$version" in
            *-*) tag="${version#*-}"; tag="${tag%%.*}" ;;
          esac
          if out=$(npm publish "$file" --access public --provenance --tag "$tag" 2>&1); then
            echo "$out"
            exit 0
          fi
          echo "$out"
          if grep -qE "cannot publish over the previously published version|previously staged version" <<<"$out"; then
            echo "$name@$version was already published (or is still staged), continuing"
            exit 0
          fi
          echo "::error::npm publish failed for $name@$version"
          exit 1

  release:
    name: release
    # After npm, so a failed publish leaves no GitHub Release.
    needs: publish-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes

      # The CHANGELOG.md entry preflight checked, then GitHub's generated list of merged PRs after it.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes-file "$RUNNER_TEMP/release-notes/notes.md" --generate-notes $prerelease

  # Last: tell the Homebrew tap (its-magdy/homebrew-tap) to move Formula/dtwin.rb to this version. Its update-dtwin.yml
  # workflow fetches the npm tarball just published, recomputes the sha256 and commits the formula. Needs a GitHub App
  # installed on homebrew-tap with Contents: write (repository_dispatch requires it), whose client ID and private key are
  # this repo's HOMEBREW_APP_CLIENT_ID / HOMEBREW_APP_PRIVATE_KEY secrets. A prerelease is not dispatched: `brew install`
  # follows npm's `latest`, never a prerelease dist-tag.
  homebrew:
    name: homebrew tap
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # Fail loudly, by name, rather than as an opaque token error: npm and the GitHub Release are already out, so all
      # that is left undone is the formula bump, which the tap's "Update dtwin formula" workflow can also run by hand.
      - name: Homebrew App secrets are set
        env:
          CLIENT_ID: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
        run: |
          missing=""
          [ -n "$CLIENT_ID" ] || missing="$missing HOMEBREW_APP_CLIENT_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing HOMEBREW_APP_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Homebrew tap NOT updated: repository secret(s) missing:$missing. npm and the GitHub Release are published. Add the secret(s) (Settings → Secrets and variables → Actions), then re-run this job, or run its-magdy/homebrew-tap's \"Update dtwin formula\" workflow with version ${GITHUB_REF_NAME#v}."
            exit 1
          fi

      - name: Homebrew tap token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: its-magdy
          repositories: homebrew-tap
          permission-contents: write

      - name: Trigger Homebrew tap update
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh api repos/its-magdy/homebrew-tap/dispatches \
            --method POST \
            --field event_type=dtwin-release \
            --field client_payload[version]="${VERSION#v}"
