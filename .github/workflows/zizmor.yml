name: zizmor

# Static security analysis of the workflows themselves (https://docs.zizmor.sh): unpinned actions, broad token
# permissions, persisted credentials, template injection, dangerous triggers. A finding fails the check and is annotated
# on the PR (advanced-security off: no SARIF upload, so no write permission, and Dependabot / fork PRs run it too).
on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/dependabot.yml"]
  pull_request:
    paths: [".github/workflows/**", ".github/dependabot.yml"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
