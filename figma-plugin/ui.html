<style>
  body { font: 13px -apple-system, sans-serif; margin: 0; padding: 14px; color: #222; }
  #status { margin-bottom: 12px; color: #555; min-height: 18px; }
  #status.err { color: #c0362c; }
  button { display: block; width: 100%; margin: 6px 0; padding: 8px; border: 1px solid #ccc;
           border-radius: 6px; background: #fff; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: 0.4; cursor: default; }
  button:not(:disabled):hover { background: #f4f4f4; }
  .primary { background: #0d99ff; color: #fff; border-color: #0d99ff; font-weight: 600; }
  .primary:not(:disabled):hover { background: #0a86e0; }
  .sep { height: 1px; background: #eee; margin: 12px 0; }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #999; margin: 4px 0; }
  .hint { margin-top: 12px; font-size: 11px; color: #999; }
  .row { display: flex; gap: 6px; }
  .row button { margin: 6px 0; }
  input { flex: 1; box-sizing: border-box; padding: 8px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
  #bridge { font-size: 11px; margin-top: 12px; padding: 6px 8px; border-radius: 6px; background: #f6f6f6; color: #888; }
  #bridge.on { background: #e7f7ec; color: #1a7f3c; }
  /* `button { display: block }` above beats a bare [hidden], so the hide rule has to win explicitly —
     otherwise the Cancel button is permanently visible. */
  [hidden] { display: none !important; }
  /* A PERSISTENT failure notice, deliberately not the #status line: status is overwritten by the very
     next selection change or export, and "the browser delivered 0 of your 400 files" is precisely the
     message that must still be on screen when you come back to the window. */
  #banner { margin-bottom: 12px; padding: 8px; border: 1px solid #f0b4ae; border-radius: 6px;
            background: #fdecea; color: #9b1c12; font-size: 12px; line-height: 1.4; }
  #progress { height: 6px; margin-bottom: 12px; border-radius: 3px; background: #eee; overflow: hidden; }
  #bar { height: 100%; width: 0; background: #0d99ff; }
  /* Phases with no page count (the design-system catalog, per-asset ticks inside one huge frame) still
     have to look ALIVE — a bar frozen at 0% reads as a hang. */
  #progress.indet #bar { width: 30%; animation: indet 1.2s linear infinite; }
  @keyframes indet { from { margin-left: -30%; } to { margin-left: 100%; } }
  #cancel { border-color: #c0362c; color: #c0362c; }
</style>

<div id="status">Loading…</div>
<div id="banner" hidden></div>
<div id="progress" hidden><div id="bar"></div></div>

<div class="label">Export</div>
<button id="run-sel" disabled>Export current selection</button>
<button id="run-full" class="primary">Export design system + all page frames</button>
<!-- Shown only while a run is walking the file — INCLUDING one a CLI/MCP client started, which the
     designer never clicked for and would otherwise have no way to stop. -->
<button id="cancel" hidden>Cancel export</button>

<div class="sep"></div>
<div class="label">Downloads</div>
<div id="downloads"></div>
<button id="layers" disabled>Download layers (<span id="lcount">0</span>)</button>
<button id="assets" disabled>Download assets (<span id="acount">0</span>)</button>

<div class="sep"></div>
<div class="label">Bridge token</div>
<div class="row">
  <input id="token" type="password" placeholder="paste token from the bridge console" title="The bridge prints this once, the first time it starts. Lost it? Run: dtwin --show-token" />
  <button id="save-token" style="flex: 0 0 60px">Save</button>
</div>

<div id="bridge">Bridge: offline (start figma-pull or the MCP to connect)</div>
<div class="hint">Save into <code>design/</code> (assets into <code>design/assets/</code>). Bridge is localhost-only; the token authenticates it. Printed once on first start — <code>dtwin --show-token</code> reprints it.</div>

<script>
  // Everything is wrapped so a single init error can NEVER leave the UI silently frozen:
  //  - window.onerror surfaces any uncaught error as visible text in #status (no DevTools needed).
  //  - window.onmessage is registered immediately (catches early messages from code.js).
  //  - DOM-dependent wiring (button handlers, get-token) runs on DOMContentLoaded, never before the
  //    elements exist — the classic "script ran before the buttons" freeze.
  (function () {
    // The ports the bridge may listen on, in the order we try them. This list is NOT free-form: a
    // published plugin can only open sockets to ports named in manifest.json's `allowedDomains`, and
    // match patterns take no port wildcard, so every port here must also be listed there (and vice
    // versa). Adding a fourth port means shipping a new plugin VERSION through review — which is why
    // FIGMA_BRIDGE_PORT can no longer be an arbitrary number; see bridge/server-core.js.
    var BRIDGE_PORTS = [8787, 8788, 8789];
    var portIdx = 0; // which one the NEXT connect() attempt uses; advances on every failure
    var assetsState = [];
    var layerFilesState = [];
    // A batch runs for items.length * 200ms — 80s for 400 assets — with the button still on screen.
    // Two clicks used to start two interleaved batches writing the same status line and doubling the
    // download rate back into the throttle the staggering exists to clear. One at a time.
    var batchRunning = false;
    var ws = null;
    var bridgeToken = "";
    var busy = false;        // an export is in flight — block a second run (the main thread serializes too)
    var lastSelCount = 0;    // last-known selection count, so we restore run-sel state after a run ends
    // The run currently walking the file ({source,label}), or null. Driven by run-begin/run-end from
    // the main thread rather than by our own button clicks, so a BRIDGE-triggered export — which no
    // one clicked here — puts the window into exactly the same visible state.
    var running = null;
    var cancelSent = false;  // we asked to stop; don't let progress frames overwrite "Cancelling…"

    function $(id) { return document.getElementById(id); }
    // A batch button is enabled exactly when it has files AND no batch is running. DERIVED from that
    // state every time, never snapshotted-and-restored: a saved `disabled` flag goes stale the moment
    // a new export lands mid-batch, and restoring it would re-disable a button that now has files (or
    // enable one that no longer does). Same reason the manifest derives `skipped` instead of counting.
    function syncBatchButtons() {
      var lb = $("layers"); if (lb) lb.disabled = batchRunning || layerFilesState.length === 0;
      var ab = $("assets"); if (ab) ab.disabled = batchRunning || assetsState.length === 0;
    }
    // Thrown value -> message string. Byte-for-byte the body of bridge/errmsg.js, restated here only
    // because a sandboxed iframe cannot import the bundle — one copy in this file, not one per catch.
    function errText(e) { return typeof e === "string" ? e : String((e && e.message) || e); }
    function setStatus(text, isErr) {
      var s = $("status");
      if (!s) return;
      s.textContent = text;
      s.className = isErr ? "err" : "";
    }
    function setBusy(b) {
      busy = b;
      var rf = $("run-full"); if (rf) rf.disabled = b;
      var rs = $("run-sel"); if (rs) rs.disabled = b || lastSelCount === 0;
    }
    // A persistent red notice. Pass "" to clear it — only a NEW export or a new batch does that, never
    // an ordinary status update.
    function setBanner(text) {
      var b = $("banner");
      if (!b) return;
      b.textContent = text || "";
      b.hidden = !text;
    }
    // 1204 -> "1,204". A node count is the main number on the progress line and unseparated six-digit
    // counts are unreadable at a glance.
    function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
    // `frac` null => indeterminate (a phase with no page count). The bar is never hidden mid-run, so
    // "no page info yet" must still look like motion rather than a stall.
    function setProgress(frac) {
      var p = $("progress"), bar = $("bar");
      if (!p || !bar) return;
      if (frac == null) { p.className = "indet"; bar.style.width = ""; }
      else { p.className = ""; bar.style.width = Math.max(0, Math.min(100, Math.round(frac * 100))) + "%"; }
    }
    function runBegin(info) {
      running = info;
      cancelSent = false;
      var c = $("cancel"); if (c) { c.hidden = false; c.disabled = false; c.textContent = "Cancel export"; }
      var p = $("progress"); if (p) p.hidden = false;
      setProgress(null);
      setBusy(true);
      setStatus(info.source === "bridge"
        ? "Export in progress — requested over the bridge (" + info.label + ")…"
        : "Exporting…");
    }
    // Tear the run chrome down. Deliberately does NOT clear `cancelSent`: the main thread sends
    // run-end BEFORE the error that the cancellation produced, and both need to know it was a cancel.
    function runEnd() {
      running = null;
      var c = $("cancel"); if (c) c.hidden = true;
      var p = $("progress"); if (p) { p.hidden = true; p.className = ""; }
      setBusy(false);
    }

    // Any uncaught UI-script error becomes visible text in the plugin window.
    window.onerror = function (msg, src, line) {
      setStatus("UI error: " + msg + (line ? " (line " + line + ")" : ""), true);
      return false;
    };

    function b64ToBytes(b64) {
      var bin = atob(b64 || "");
      var arr = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }
    function dl(name, blob) {
      var a = document.createElement("a");
      var url = URL.createObjectURL(blob);
      a.href = url;
      a.download = name;
      a.click();
      // Release the blob once the browser has started the download — otherwise every export leaks
      // the (multi-MB) object URL for the plugin window's lifetime.
      setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
    }
    function send(type) {
      setStatus("Exporting…");
      parent.postMessage({ pluginMessage: { type: type } }, "*");
    }

    // ---- messages FROM the Figma main thread (code.js). Registered immediately. ----
    window.onmessage = function (e) {
      var m = e.data && e.data.pluginMessage;
      if (!m) return;

      if (m.type === "selection") {
        lastSelCount = m.count;
        var rs = $("run-sel");
        if (rs && !busy) rs.disabled = m.count === 0;
        // Figma fires selectionchange freely while an export runs (and collectNode selects the node it
        // exported), so without this guard a selection event wipes the progress line mid-walk.
        if (running) return;
        setStatus(
          m.count === 0
            ? "Select a frame for single-screen export, or use the blue button for the whole page."
            : m.count + " selected" + (m.name ? ' — "' + m.name + '"' : "") + "."
        );
        return;
      }
      // ---- run lifecycle + progress (both manual and bridge-triggered runs) ----
      if (m.type === "run-begin") { runBegin(m); return; }
      if (m.type === "run-end") {
        var wasCancelled = cancelSent;
        runEnd();
        // Bridge-triggered runs never produce a `files`/`error` message here, so this is the ONLY
        // place a designer learns their cancel took effect on one.
        if (wasCancelled) setStatus("Export cancelled — nothing was delivered.", true);
        return;
      }
      if (m.type === "progress") {
        if (!running) runBegin(m); // a frame that outran its run-begin — never show progress with no chrome
        if (cancelSent) return;    // "Cancelling…" must not be overwritten by in-flight frames
        var pg = m.page;
        setProgress(pg && pg.of ? pg.index / pg.of : null);
        var bits = [];
        if (typeof m.nodes === "number" && m.nodes) bits.push(fmt(m.nodes) + " nodes");
        if (typeof m.assets === "number" && m.assets) bits.push(fmt(m.assets) + " assets");
        var detail = bits.length ? " (" + bits.join(", ") + ")" : "";
        var who = m.source === "bridge" ? " [bridge: " + m.label + "]" : "";
        var line;
        if (m.phase === "design-system") line = "Building the design system" + (pg ? " — page " + pg.index + " of " + pg.of + ", " + pg.name : "") + detail + "…";
        else if (pg) line = "Exporting page " + pg.index + " of " + pg.of + " — " + pg.name + detail + "…";
        else line = "Exporting" + detail + "…";
        setStatus(line + who);
        return;
      }
      if (m.type === "cancel-ack") {
        // Refused (nothing was running) — say so and put the window back, rather than leaving a
        // "Cancelling…" that will never resolve.
        if (!m.accepted) { cancelSent = false; runEnd(); setStatus("Nothing to cancel — the export had already finished."); }
        return;
      }
      if (m.type === "error") {
        var errWasCancel = cancelSent;
        runEnd();
        setStatus(errWasCancel ? "Export cancelled — nothing was delivered." : m.message, true);
        return;
      }
      if (m.type === "files") {
        runEnd();
        setBanner(""); // a fresh successful export clears the previous batch's failure notice
        // The warnings COUNT, surfaced next to the summary. The list itself is in the export's own
        // manifest; showing only `summary` meant a run with 40 unexported icons read as a clean one.
        setStatus("Ready: " + m.summary
          + (m.warnings ? " — " + fmt(m.warnings) + " warning" + (m.warnings === 1 ? "" : "s") + ", see manifest.warnings in the export" : ""));
        var wrap = $("downloads");
        if (wrap) {
          wrap.innerHTML = "";
          m.files.forEach(function (f) {
            var row = document.createElement("div");
            row.className = "row";
            var d = document.createElement("button");
            d.textContent = "Download " + f.name;
            d.onclick = function () { dl(f.name, new Blob([f.content], { type: "application/json" })); };
            row.appendChild(d);
            if (f.copyable) {
              var c = document.createElement("button");
              c.textContent = "Copy";
              c.style.flex = "0 0 70px";
              c.onclick = function () { navigator.clipboard.writeText(f.content); };
              row.appendChild(c);
            }
            wrap.appendChild(row);
          });
        }
        assetsState = m.assets || [];
        var ac = $("acount"); if (ac) ac.textContent = assetsState.length;
        layerFilesState = m.layerFiles || [];
        var lc = $("lcount"); if (lc) lc.textContent = layerFilesState.length;
        syncBatchButtons();
        return;
      }
      if (m.type === "token") {
        bridgeToken = m.token || "";
        var t = $("token"); if (t) t.value = bridgeToken;
        connect();
        return;
      }
      if (m.type === "identity") {
        // The main thread answered "who am I". Forward it to the bridge as an unsolicited `hello` so
        // the bridge can tell this file apart from any OTHER Figma file connected at the same time.
        // Sent on every socket open (see onopen), never cached: if Figma restarts the plugin runtime
        // the instanceId changes, and re-deriving it each time is what keeps the bridge's listing
        // honest without any session-token machinery.
        var idn = m.identity || {};
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({
            type: "hello",
            instanceId: idn.instanceId || null,
            file: idn.file || null,
            fileKey: idn.fileKeyAvailable ? idn.fileKey : null,
            page: idn.page || null
          }));
        }
        if (idn.file) setBridge(true, "connected as " + JSON.stringify(idn.file));
        return;
      }
      if (m.type === "bridge-result") {
        if (ws && ws.readyState === 1) {
          ws.send(JSON.stringify({ id: m.id, ok: m.ok, result: m.result, error: m.error }));
        }
        return;
      }
    };

    // ---- the localhost bridge (WebSocket client) ----
    function setBridge(on, text) {
      var el = $("bridge");
      if (!el) return;
      el.className = on ? "on" : "";
      el.textContent = "Bridge: " + text;
    }
    // Reconnect discipline. Every handler below is guarded by `s === ws` so only the CURRENT socket
    // can drive state, and reconnects go through a single shared timer. Without both, each retired
    // socket kept its own live reconnect chain: saving the token closed a socket AND called connect()
    // immediately, then 3s later the closed socket's onclose connected again — so sockets multiplied
    // with every save (and with every stale-socket terminate() from the bridge).
    var reconnectTimer = null;
    function scheduleReconnect() {
      if (reconnectTimer) return; // one pending reconnect at a time, ever
      reconnectTimer = setTimeout(function () { reconnectTimer = null; connect(); }, 3000);
    }
    function dropSocket() {
      if (!ws) return;
      var old = ws;
      ws = null;
      old.onopen = old.onclose = old.onerror = old.onmessage = null; // retire it silently
      try { old.close(); } catch (e) {}
    }
    function connect() {
      if (!bridgeToken) { setBridge(false, "offline — paste the bridge token above"); return; }
      if (ws && (ws.readyState === 0 || ws.readyState === 1)) return; // already CONNECTING/OPEN
      // Try each allowed port in turn rather than only 8787. A bridge that lost the race for 8787 to
      // some unrelated local process is otherwise invisible to the plugin, and the user has no way to
      // point it elsewhere — the manifest, not a setting, decides what we may dial.
      var port = BRIDGE_PORTS[portIdx % BRIDGE_PORTS.length];
      portIdx++;
      var s;
      try {
        s = new WebSocket("ws://localhost:" + port + "/?token=" + encodeURIComponent(bridgeToken));
      } catch (e) { setBridge(false, "offline"); scheduleReconnect(); return; }
      ws = s;
      s.onopen = function () {
        if (s !== ws) return;
        // Stick to whatever answered: the next reconnect should retry the LIVE bridge's port first,
        // not resume walking the ladder past it.
        portIdx = BRIDGE_PORTS.indexOf(port);
        setBridge(true, "connected (localhost:" + port + ")");
        // Announce which FILE this is, every time the socket opens — including each reconnect. The
        // bridge accepts several plugin instances at once (one per open Figma file) and routes
        // commands by identity, so a connection that never says who it is can only be addressed by
        // its raw connection id.
        parent.postMessage({ pluginMessage: { type: "get-identity" } }, "*");
      };
      s.onclose = function () { if (s !== ws) return; ws = null; setBridge(false, "offline"); scheduleReconnect(); };
      s.onerror = function () { try { s.close(); } catch (e) {} };
      s.onmessage = function (ev) {
        if (s !== ws) return;
        var cmd;
        try { cmd = JSON.parse(ev.data); } catch (e) { return; }
        parent.postMessage({ pluginMessage: { type: "bridge", id: cmd.id, cmd: cmd.cmd, args: cmd.args } }, "*");
      };
    }

    // ---- DOM-dependent wiring — runs only once the elements exist ----
    function init() {
      try {
        var rs = $("run-sel"); if (rs) rs.onclick = function () { if (busy) return; setBusy(true); setStatus("Exporting…"); send("run-selection"); };
        var rf = $("run-full"); if (rf) rf.onclick = function () { if (busy) return; setBusy(true); setStatus("Exporting…"); send("run-full"); };
        var cb = $("cancel"); if (cb) cb.onclick = function () {
          if (!running || cancelSent) return;
          cancelSent = true;
          cb.disabled = true;
          cb.textContent = "Cancelling…";
          // Honest about the latency: the walk only aborts where it already awaits (between pages,
          // between top-level frames, at each asset export), so the last exportAsync still finishes.
          setStatus("Cancelling — the export stops at its next safe point…");
          parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
        };
        var st = $("save-token"); if (st) st.onclick = function () {
          var t = $("token"); bridgeToken = (t && t.value ? t.value : "").trim();
          parent.postMessage({ pluginMessage: { type: "set-token", token: bridgeToken } }, "*");
          dropSocket(); // retires handlers first, so the old socket can't schedule its own reconnect
          connect();
        };
        // Source images keep their ORIGINAL container format (png/jpg/webp/gif, detected from magic
        // bytes in assets.ts), so the MIME must follow a.format rather than always claiming PNG.
        var MIME = { svg: "image/svg+xml", png: "image/png", jpg: "image/jpeg", webp: "image/webp", gif: "image/gif" };
        // Chromium (which Figma desktop embeds) throttles programmatic downloads to ~10 PER SECOND —
        // a rate limit, not a total cap — and silently drops what exceeds it, so a `forEach(dl)` over a
        // real export's dozens of layers or hundreds of assets delivered the first handful and looked
        // like it delivered them all. 200ms spacing puts us at 5/s, comfortably under. Stagger them and
        // report the actual count, so "done" means done. `label` names the batch in the status line;
        // `make` builds each Blob lazily, one at a time, instead of materialising every asset's bytes
        // up front.
        // NOT fixed by pacing: Chrome's per-site "Automatic downloads" permission can block multi-file
        // downloads outright at any rate. A blocked anchor click does not throw, so `failed` stays empty
        // and the batch would otherwise announce a full delivery of zero files — the silent truncation
        // this file refuses everywhere else. We cannot detect it, so the completion line names it.
        // Re-entry is refused, and BOTH batch buttons go disabled for the duration (syncBatchButtons
        // reads `batchRunning`) so it is visible why.
        function dlBatch(items, label, name, make) {
          if (!items.length) return;
          if (batchRunning) { setStatus("A download batch is already running — wait for it to finish.", true); return; }
          batchRunning = true;
          setBanner(""); // this attempt's outcome replaces the last one's, never stacks on it
          syncBatchButtons();
          var done = function () {
            batchRunning = false;
            syncBatchButtons();
          };
          var i = 0;
          var failed = [];
          setStatus("Downloading " + items.length + " " + label + "… 0/" + items.length);
          (function step() {
            if (i >= items.length) {
              done();
              // Report the WHOLE outcome. Aborting the batch on the first failure — as this did —
              // threw away every remaining item over one bad blob, and a partial delivery that
              // announces itself as finished is the silent-truncation this file avoids everywhere
              // else. One bad asset should cost you that asset, not the other 399.
              var delivered = items.length - failed.length;
              if (!failed.length) {
                setStatus("Downloaded " + items.length + " " + label + " — if fewer arrived, allow “Automatic downloads” for figma.com and retry.");
              } else if (delivered === 0) {
                // ZERO delivered is a different event from "3 of 400 failed": nothing landed on disk,
                // and the cause is almost always Chrome's per-site "Automatic downloads" permission
                // rather than the blobs themselves. It gets the persistent banner — a status line here
                // is gone the moment the next selection change or export writes over it, which is how
                // this failed silently before.
                setBanner("Downloaded 0 of " + items.length + " " + label + " — nothing was saved. "
                  + "Allow “Automatic downloads” for figma.com in your browser/desktop-app settings, then click the button again. "
                  + "First failure: " + failed[0]);
                setStatus("Download failed — see the notice above.", true);
              } else {
                setBanner("Downloaded " + delivered + " of " + items.length + " " + label + " — " + failed.length + " failed: " + failed.join(", "));
                setStatus("Downloaded " + delivered + "/" + items.length + " " + label + " — see the notice above.", true);
              }
              return;
            }
            var it = items[i++];
            try { dl(name(it), make(it)); } catch (e) { failed.push(name(it) + " (" + errText(e) + ")"); }
            setStatus("Downloading " + items.length + " " + label + "… " + i + "/" + items.length + (failed.length ? " (" + failed.length + " failed)" : ""));
            setTimeout(step, 200); // ~200ms is the spacing that reliably clears Chromium's throttle
          })();
        }
        var lb = $("layers"); if (lb) lb.onclick = function () {
          dlBatch(layerFilesState, "layer file(s)", function (f) { return f.name; }, function (f) {
            return new Blob([f.content], { type: "application/json" });
          });
        };
        var as = $("assets"); if (as) as.onclick = function () {
          // a.file is the name the plugin already wrote into the tree's `asset` path — use it verbatim
          // rather than re-deriving the convention (this copy had already drifted: it sanitised the id
          // but not the format).
          dlBatch(assetsState, "asset(s)", function (a) { return a.file; }, function (a) {
            var type = MIME[a.format] || "application/octet-stream";
            return a.text != null ? new Blob([a.text], { type: type }) : new Blob([b64ToBytes(a.base64)], { type: type });
          });
        };
        // Ask code.js for the stored token; connect() runs once it replies. Also proves the round-trip.
        parent.postMessage({ pluginMessage: { type: "get-token" } }, "*");
        setStatus("Ready — select a frame, or use the blue button.");
      } catch (e) {
        setStatus("UI init error: " + errText(e), true);
      }
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  })();
</script>
